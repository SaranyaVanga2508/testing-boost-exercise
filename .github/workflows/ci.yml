name: Boost Exercise

on: [push] 

jobs:
  style:
    name: Style Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup clang-format
      run: sudo apt update && sudo apt install -y clang-format
    - name: Run clang-format lint
      run: clang-format -i src/*.cpp src/*.hpp tests/*.cpp --dry-run -Werror
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install all dependencies
      run: sudo apt update && sudo apt install -y libboost-test-dev libeigen3-dev libyaml-cpp-dev cmake
    - name: Build using cmake
      run: |
        mkdir build
        cd build
        cmake ..
        make -j
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Install all dependencies
      run: sudo apt update && sudo apt install -y libboost-test-dev libeigen3-dev libyaml-cpp-dev cmake
    - name: Build using cmake
      run: |
        mkdir build
        cd build
        cmake ..
        make -j
    - name: Run tests
      run: cd build && ctest --output-on-failure
